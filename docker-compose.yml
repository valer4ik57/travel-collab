services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: travel_collab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_collab
    ports:
      - "5433:5432"
    volumes:
      - travel_collab_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_collab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_collab_pgdata:
